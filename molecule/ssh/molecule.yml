---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ubuntu-ssh
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: '/bin/sh -c "while sleep 3600; do :; done"'
  - name: almalinux-ssh
    image: almalinux/9-init:9
    pre_build_image: true
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
verifier:
  name: ansible
