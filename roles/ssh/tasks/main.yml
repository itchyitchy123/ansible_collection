---
- name: Require explicit SSH lockout acknowledgement
  ansible.builtin.assert:
    that: ssh_hardening_confirmed | bool
    fail_msg: >-
      Set ssh_hardening_confirmed=true only after verifying that a non-root
      administrator can authenticate with an SSH key.
  when:
    - ssh_permit_root_login in ['no', 'prohibit-password']
    - ssh_password_authentication == 'no'
- name: Install SSH server
  ansible.builtin.package:
    name: "{{ 'openssh-server' if ansible_facts.os_family == 'Debian' else 'openssh-server' }}"
    state: present
- name: Enable SSH server
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
    state: started
    enabled: true
- name: Configure SSH safely
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-opsforge.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH
