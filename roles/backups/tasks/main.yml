---
- name: Create backup destination
  ansible.builtin.file:
    path: "{{ backup_destination }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
- name: Install backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/sbin/opsforge-backup
    owner: root
    group: root
    mode: "0700"
- name: Schedule backups
  ansible.builtin.cron:
    name: OpsForge system backup
    minute: "{{ backup_schedule.split()[0] }}"
    hour: "{{ backup_schedule.split()[1] }}"
    day: "{{ backup_schedule.split()[2] }}"
    month: "{{ backup_schedule.split()[3] }}"
    weekday: "{{ backup_schedule.split()[4] }}"
    job: /usr/local/sbin/opsforge-backup
